
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novara Fashion</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f8f7f4;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  letter-spacing: 3px;
  font-weight: bold;
}

header span {
  font-size: 14px;
}

.hero {
  text-align: center;
  padding: 85px 15px;
  background: #e8ded3;
}

.hero h1 {
  font-size: 38px;
  margin-bottom: 15px;
}

.hero p {
  margin-bottom: 25px;
}

.hero a {
  background: #111;
  color: white;
  padding: 13px 28px;
  text-decoration: none;
}

h2 {
  text-align: center;
  margin: 40px 0 25px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
}

.product {
  background: white;
  padding-bottom: 18px;
  text-align: center;
  border-radius: 8px;
  overflow: hidden;
}

.product img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.product h3 {
  margin: 12px 0;
}

.product p {
  margin-bottom: 12px;
}

button {
  background: #111;
  color: white;
  border: none;
  padding: 11px 18px;
  cursor: pointer;
}

footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 40px;
}

@media (max-width: 350px) {
  .products {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NOVARA</div>
  <span>🛍️ Cart: <b id="cart">0</b></span>
</header>

<section class="hero">
  <h1>Discover Your Style</h1>
  <p>Fashion that makes you different.</p>
  <a href="#shop">SHOP NOW</a>
</section>

<h2 id="shop">OUR COLLECTION</h2>

<section class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500" alt="Fashion outfit">
<h3>Women Fashion</h3>
<p>₹999</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500" alt="Fashion outfit">
<h3>Casual Style</h3>
<p>₹799</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="T-shirt">
<h3>Classic T-shirt</h3>
<p>₹599</p>
<button onclick="addCart()">Add to Cart</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=500" alt="Fashion bag">
<h3>Fashion Bag</h3>
<p>₹1199</p>
<button onclick="addCart()">Add to Cart</button>
</div>

</section>

<footer>
<h2>NOVARA FASHION</h2>
<p>Your Style, Your Identity.</p>
<p>© 2026 Novara Fashion</p>
</footer>

<script>
let count = 0;

function addCart() {
  count++;
  document.getElementById("cart").innerText = count;
  alert("Product added to cart!");
}
</script>

</body>
</html>
